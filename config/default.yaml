# Complete configuration; paths resolve relative to this YAML file.
mode: scaffold
provenance:
  git_commit: null  # Set to the full commit SHA when deploying.
  release_tag: null
  calibration_id: null
acquisition:
  heartbeat_seconds: 10
  retry_initial_seconds: 1
  retry_max_seconds: 60
camera_preview:
  exposure_mode: shared_auto
  stream_bytes_per_second: null  # Commission on the deployed camera network before setting.
  initial_exposure_us: 15000
  minimum_exposure_us: 100
  maximum_exposure_us: 500000
  brightness_percentile: 99
  target_brightness_dn: 180
  brightness_tolerance_dn: 10
  maximum_step_factor: 2
observation_capture:
  interval_seconds: 600
  exposure_mode: fixed  # shared_auto is implemented but requires field validation.
  initial_exposure_us: 15000
  minimum_exposure_us: 100
  maximum_exposure_us: 120000000
  brightness_percentile: 99
  target_brightness_dn: 2880
  brightness_tolerance_dn: 160
  maximum_step_factor: 2
  timeout_margin_seconds: 10
  maximum_capture_attempts: 3
  stream_bytes_per_second: null  # Commission on the deployed camera network before setting.
polarization_preview:
  instrument_matrix: null  # Optional provisional diagnostic calibration; see docs/calibration.md.
cameras:
  - id: camera_1
    model: Allied Vision Mako G-223B
    serial: null
    polarizer_angle_deg: null
    preview_relative_gain: null
  - id: camera_2
    model: Allied Vision Mako G-223B
    serial: null
    polarizer_angle_deg: null
    preview_relative_gain: null
  - id: camera_3
    model: Allied Vision Mako G-223B
    serial: null
    polarizer_angle_deg: null
    preview_relative_gain: null
sensors:
  bme280:
    interface: i2c
    bus: null
    address: null
  epever:
    model: EPEVER Tracer 2210AN
    interface: usb-rs485-modbus-rtu
    device: null  # Prefer a stable /dev/serial/by-id/... path.
    slave_address: null
    baudrate: null
    parity: null
    stopbits: null
storage:
  data_root: ../data
  state_root: ../state
  minimum_free_bytes: 1073741824
dashboard:
  host: 127.0.0.1
  port: 8000
  stale_after_seconds: 90
