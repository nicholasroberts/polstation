[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polstation"
version = "0.1.0.dev0"
description = "Headless sky-polarization field instrument scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
sensor-preview = ["minimalmodbus>=2.1,<3", "RPi.bme280>=0.2.4,<1"]
calibration = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.scripts]
polstation-acquisition = "polstation.acquisition.service:main"
polstation-dashboard = "polstation.web.app:main"
polstation-check-config = "polstation.config:main"
polstation-camera-preview = "polstation.cameras.preview:main"
polstation-sensor-preview = "polstation.sensors.preview:main"
polstation-camera-linearity = "polstation.calibration.linearity:main"
polstation-observation-recorder = "polstation.acquisition.recording:main"
polstation-system-summary = "polstation.health.system_summary:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polstation.web" = ["static/*.html", "static/*.css", "static/*.js"]
"polstation.polarization" = ["colormaps/*.json", "colormaps/*.txt"]
